name: Check pending match results

on:
  workflow_dispatch: {}
  schedule:
    - cron: '7 7 * * *'


jobs:
  check:
    name: Fetch results and open PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch results from football-data.org
        id: check
        env:
          UFNC_BASE_URL: ${{ vars.UFNC_BASE_URL }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: node .github/scripts/check-pending-matches.mjs

      - name: Open PR with resolved results
        if: steps.check.outputs.results_found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="match-results/${DATE}"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add .github/pending-results/
          git commit -m "chore(match): add pending results for ${DATE}

          Co-Authored-By: Claude <noreply@anthropic.com>"
          git push origin "$BRANCH"

          # Build PR body listing each resolved match
          MATCH_LINES=""
          for f in .github/pending-results/*.json; do
            league=$(jq -r '.league' "$f")
            home=$(jq -r '.home' "$f")
            away=$(jq -r '.away' "$f")
            score=$(jq -r '.risultato' "$f")
            outcome=$(jq -r '.outcome' "$f")
            date=$(jq -r '.data' "$f")
            MATCH_LINES="${MATCH_LINES}
* ${date} | ${league} | ${home} vs ${away} | ${score} | outcome=${outcome}"
          done

          gh pr create \
            --title "chore(match): update match results ${DATE}" \
            --body "## Match results ready for review

The following matches were resolved and are ready to be applied to the database.
**Review the results below and merge to apply them.**
${MATCH_LINES}

Outcome codes: \`v\` = defender wins, \`d\` = draw, \`s\` = challenger wins (title changes hands).

Generated with [Claude Code](https://claude.com/claude-code)" \
            --base main \
            --head "$BRANCH" \
            --label "match-result"
