name: Check pending match results

on:
  workflow_dispatch: {}
  schedule:
    - cron: '7 7 * * *'  # daily at 07:07 UTC

jobs:
  check:
    name: Fetch results and open PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Per-league check and PR creation
        env:
          GH_TOKEN: ${{ github.token }}
          UFNC_BASE_URL: ${{ vars.UFNC_BASE_URL }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: |
          set -euo pipefail

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          DATE=$(date -u +%Y-%m-%d)
          ANY_PR=false

          for league in serie_a premier_league liga; do
            echo ""
            echo "=== ${league} ==="

            # Skip if an open PR already exists for this league
            OPEN=$(gh pr list --state open --json headRefName \
              --jq "[.[] | select(.headRefName | startswith(\"match-results/${league}/\"))] | length")
            if [ "$OPEN" -gt 0 ]; then
              echo "${league}: open PR already exists — skipping"
              continue
            fi

            # Run the script for this league only
            LEAGUE_OUTPUT=$(mktemp)
            LEAGUE=$league GITHUB_OUTPUT=$LEAGUE_OUTPUT \
              node .github/scripts/check-pending-matches.mjs || true
            FOUND=$(grep -c "results_found=true" "$LEAGUE_OUTPUT" || true)
            rm -f "$LEAGUE_OUTPUT"

            if [ "$FOUND" -eq 0 ]; then
              echo "${league}: no new results found"
              continue
            fi

            BRANCH="match-results/${league}/${DATE}"

            # Delete stale remote branch/PR from a previous failed run if present
            gh pr close "$BRANCH" 2>/dev/null || true
            git push origin --delete "$BRANCH" 2>/dev/null || true

            git checkout -b "$BRANCH"
            git add ".github/pending-results/${league}/"
            git commit -m "chore(match): add ${league} results for ${DATE}

            Co-Authored-By: Claude <noreply@anthropic.com>"
            git push origin "$BRANCH"

            MATCH_LINES=""
            for f in ".github/pending-results/${league}/"*.json; do
              home=$(jq -r '.home' "$f")
              away=$(jq -r '.away' "$f")
              score=$(jq -r '.risultato' "$f")
              outcome=$(jq -r '.outcome' "$f")
              mdate=$(jq -r '.data' "$f")
              MATCH_LINES="${MATCH_LINES}"$'\n'"* ${mdate} | ${home} vs ${away} | ${score} | outcome=${outcome}"
            done

            cat > "/tmp/pr-body-${league}.md" <<PRBODY
## Match results ready for review — ${league}

The following match was resolved and is ready to be applied to the database.
**Review the result below and merge to apply it.**
${MATCH_LINES}

Outcome codes: \`v\` = defender wins, \`d\` = draw, \`s\` = challenger wins (title changes hands).

Generated with [Claude Code](https://claude.com/claude-code)
PRBODY

            gh pr create \
              --title "chore(match): ${league} results ${DATE}" \
              --body-file "/tmp/pr-body-${league}.md" \
              --base main \
              --head "$BRANCH" \
              --label "match-result"

            ANY_PR=true

            # Return to main for the next league
            git checkout main
          done

          echo "Done. Any PRs opened: ${ANY_PR}"
